<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2A66">
<title>Glow Dental — Catalogue 2026 · Matériel dentaire</title>
<meta name="description" content="Catalogue 2026 Glow Dental : 284 produits dentaires (hygiène, fraises, empreinte, endodontie, obturation, équipements, orthodontie, instruments). Commande en ligne via WhatsApp.">
<meta property="og:type" content="website">
<meta property="og:title" content="Glow Dental — Catalogue 2026">
<meta property="og:description" content="284 produits dentaires avec prix. Commandez en 1 minute via WhatsApp.">
<meta property="og:image" content="https://glow-dental-maroc.vercel.app/og.jpg">
<meta property="og:url" content="https://glow-dental-maroc.vercel.app/">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Glow Dental">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --navy:#0A2A66; --blue:#1557D6; --sky:#E8F0FF; --mint:#16B88A; --mint-soft:#E3F8F1;
  --ink:#0E1726; --muted:#667085; --line:#E7EAF0; --bg:#F5F7FB; --card:#fff;
  --r:18px; --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(110px + var(--sb))}

/* Header */
.top{background:linear-gradient(160deg,#0A2A66 0%,#123E92 60%,#1557D6 100%);color:#fff;padding:calc(14px + var(--st)) 16px 18px;border-radius:0 0 26px 26px;position:relative;overflow:hidden}
.top:after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%)}
.brand{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;border:1px solid rgba(255,255,255,.22)}
.brand h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.2px}
.brand small{display:block;font-size:12px;opacity:.75;font-weight:500;margin-top:1px}
.cartbtn{margin-left:auto;width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;position:relative;border:1px solid rgba(255,255,255,.22)}
.badge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--mint);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid #123E92}
.badge[hidden]{display:none}
.hero{position:relative;z-index:1;margin-top:16px}
.hero p{margin:0 0 12px;font-size:13px;opacity:.85}
.hero b{font-size:21px;line-height:1.25;display:block;margin-bottom:6px;font-weight:800}
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:0 12px;height:48px;color:var(--ink);box-shadow:0 8px 24px rgba(5,20,60,.25)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search input{flex:1;border:0;outline:0;height:100%;background:transparent;font-size:15px}
.search .clr{color:var(--muted);font-size:20px;line-height:1;padding:4px}
.stats{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.stats span{font-size:11.5px;font-weight:600;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);padding:5px 10px;border-radius:99px}

/* Categories */
.cats{position:sticky;top:0;z-index:20;background:rgba(245,247,251,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);padding:12px 0 10px;padding-top:calc(12px + var(--st))}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:#344054;white-space:nowrap}
.chip i{font-style:normal;font-size:16px}
.chip em{font-style:normal;font-size:11px;color:var(--muted);font-weight:700;background:var(--bg);padding:2px 6px;border-radius:99px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.on em{background:rgba(255,255,255,.18);color:#fff}
.bar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 0;font-size:13px;color:var(--muted)}
.bar select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 8px;font-size:13px;font-weight:600;color:#344054}

/* Sections & grid */
.sec{padding:6px 16px 4px}
.sec h2{font-size:17px;margin:18px 0 10px;display:flex;align-items:center;gap:8px;font-weight:800}
.sec h2 span{font-size:12px;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative;border:1px solid #EEF1F6}
.card .ph{aspect-ratio:1/1;background:#fff;display:grid;place-items:center;padding:10px;border-bottom:1px solid #F1F3F7}
.card .ph img{width:100%;height:100%;object-fit:contain}
.card .bd{padding:10px 11px 11px;display:flex;flex-direction:column;flex:1}
.card .nm{font-size:13.2px;font-weight:600;line-height:1.3;min-height:34px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .ft{display:flex;align-items:flex-end;justify-content:space-between;margin-top:8px;gap:6px}
.price{font-weight:800;font-size:16px;color:var(--navy);white-space:nowrap}
.price small{font-size:11px;font-weight:600;color:var(--muted);display:block;line-height:1.1}
.price.ask{font-size:13px;color:var(--muted)}
.add{width:36px;height:36px;border-radius:11px;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 10px rgba(21,87,214,.3)}
.add:active{transform:scale(.94)}
.mini{display:flex;align-items:center;background:var(--sky);border-radius:11px;height:36px;flex:none}
.mini button{width:30px;height:36px;font-size:18px;font-weight:700;color:var(--blue)}
.mini b{min-width:18px;text-align:center;font-size:14px}
.tag{position:absolute;top:8px;left:8px;font-size:10.5px;font-weight:700;background:var(--mint-soft);color:#0B7F5F;padding:3px 8px;border-radius:99px}
.empty{text-align:center;padding:50px 24px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

/* Footer */
.foot{margin:28px 16px 0;background:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--shadow);font-size:13px;color:#475467;line-height:1.55}
.foot b{color:var(--ink)}

/* Floating cart bar */
.fab{position:fixed;left:50%;transform:translateX(-50%) translateY(140%);bottom:calc(14px + var(--sb));width:calc(100% - 28px);max-width:532px;z-index:40;background:var(--navy);color:#fff;border-radius:18px;padding:12px 14px 12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 14px 34px rgba(10,42,102,.4);transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
.fab.show{transform:translateX(-50%) translateY(0)}
.fab .q{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.15);display:grid;place-items:center;font-weight:800}
.fab .t{flex:1;line-height:1.2}
.fab .t small{display:block;font-size:11.5px;opacity:.75}
.fab .t b{font-size:16px}
.fab .go{background:var(--mint);padding:10px 14px;border-radius:12px;font-weight:700;font-size:14px;color:#fff}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:560px;max-height:92vh;background:#fff;border-radius:24px 24px 0 0;z-index:60;display:flex;flex-direction:column;transition:transform .32s cubic-bezier(.2,.9,.3,1)}
.sheet.on{transform:translate(-50%,0)}
.grab{width:42px;height:5px;border-radius:9px;background:#D0D5DD;margin:10px auto 2px;flex:none}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 10px;flex:none}
.sh-h h3{margin:0;font-size:18px;font-weight:800}
.x{width:36px;height:36px;border-radius:11px;background:var(--bg);display:grid;place-items:center;font-size:20px;color:#475467}
.sh-b{overflow-y:auto;padding:0 18px 12px;flex:1;-webkit-overflow-scrolling:touch}
.sh-f{padding:12px 18px calc(14px + var(--sb));border-top:1px solid var(--line);flex:none;background:#fff}

.pimg{background:#fff;border:1px solid var(--line);border-radius:20px;aspect-ratio:4/3;display:grid;place-items:center;padding:14px;margin-bottom:14px}
.pimg img{max-width:100%;max-height:100%;object-fit:contain}
.pcat{font-size:12px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.6px}
.pname{font-size:21px;font-weight:800;margin:4px 0 6px;line-height:1.25}
.pprice{font-size:24px;font-weight:800;color:var(--navy)}
.pprice small{font-size:13px;color:var(--muted);font-weight:600}
.lbl{font-size:13px;font-weight:700;margin:18px 0 8px;color:#344054}
.vars{display:flex;flex-wrap:wrap;gap:8px}
.var{border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13.5px;font-weight:600;background:#fff;text-align:left}
.var span{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.var.on{border-color:var(--blue);background:var(--sky);color:var(--navy)}
.var.on span{color:var(--blue)}
.qty{display:flex;align-items:center;gap:0;background:var(--bg);border-radius:14px;height:50px;flex:none}
.qty button{width:46px;height:50px;font-size:22px;font-weight:700;color:var(--blue)}
.qty b{min-width:26px;text-align:center;font-size:16px}
.row{display:flex;gap:10px;align-items:center}
.primary{flex:1;width:100%;height:52px;border-radius:15px;background:var(--blue);color:#fff;font-weight:700;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;box-shadow:0 8px 20px rgba(21,87,214,.28)}
.primary.wa{background:#1DA851;box-shadow:0 8px 20px rgba(29,168,81,.3)}
.primary[aria-disabled=true]{opacity:.45;pointer-events:none}
.ghost{height:44px;border-radius:13px;border:1.5px solid var(--line);font-weight:700;font-size:14px;color:#344054;display:flex;align-items:center;justify-content:center;gap:6px;flex:1}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.45}

/* Cart */
.steps{display:flex;gap:6px;margin:0 0 14px}
.steps div{flex:1;height:4px;border-radius:9px;background:var(--line)}
.steps div.on{background:var(--blue)}
.ci{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #F0F2F5;align-items:center}
.ci img{width:62px;height:62px;border-radius:12px;border:1px solid var(--line);object-fit:contain;background:#fff;padding:4px;flex:none}
.ci .in{flex:1;min-width:0}
.ci .in b{font-size:13.5px;font-weight:600;display:block;line-height:1.3}
.ci .in small{color:var(--muted);font-size:12px}
.ci .in .pp{font-weight:800;color:var(--navy);font-size:14px;margin-top:3px}
.ci .mini{height:34px}
.ci .mini button{height:34px}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 4px}
.tot span{color:var(--muted);font-size:14px}
.tot b{font-size:22px;font-weight:800;color:var(--navy)}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:700;color:#344054;margin-bottom:6px}
.field input,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:12px 13px;font-size:15px;background:#fff;outline:0}
.field input:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(21,87,214,.12)}
.field textarea{min-height:72px;resize:vertical}
.err{color:#D92D20;font-size:12px;margin-top:5px;display:none}
.field.bad input{border-color:#F04438}
.field.bad .err{display:block}
.recap{background:var(--bg);border-radius:14px;padding:12px 14px;font-size:13px;color:#475467;margin-bottom:14px;display:flex;justify-content:space-between}
.recap b{color:var(--navy)}
.done{text-align:center;padding:20px 6px 6px}
.done .ok{width:72px;height:72px;border-radius:50%;background:var(--mint-soft);display:grid;place-items:center;margin:0 auto 14px}
.done h4{font-size:19px;margin:0 0 6px}
.done p{color:var(--muted);margin:0 0 4px;font-size:14px;line-height:1.5}
.toast{position:fixed;left:50%;top:calc(16px + var(--st));transform:translate(-50%,-150%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:90;transition:transform .3s;box-shadow:0 10px 30px rgba(0,0,0,.25);white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.hbtns{margin-left:auto;display:flex;gap:8px}
.hbtns .cartbtn{margin-left:0}
.card.off .ph img{opacity:.45;filter:grayscale(1)}
.tag.out{background:#FEF3F2;color:#B42318}
.add[disabled]{background:#D0D5DD;box-shadow:none}
.share{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;font-weight:700;color:var(--blue);text-decoration:none;background:var(--sky);padding:8px 12px;border-radius:11px}
.ref{display:inline-block;background:var(--sky);color:var(--navy);font-weight:800;padding:6px 12px;border-radius:10px;margin:6px 0 10px;letter-spacing:.5px}
.ord{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.ord .l1{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.ord .l2{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between}
.st{font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:99px;background:var(--bg);color:#475467}
.st.nouvelle{background:#FFF6E5;color:#B54708}.st.confirmée{background:var(--sky);color:var(--blue)}.st.en.livraison,.st.livraison{background:#F4EBFF;color:#6941C6}.st.livrée{background:var(--mint-soft);color:#067647}.st.annulée{background:#FEF3F2;color:#B42318}
.install{margin:14px 16px 0;background:#fff;border:1px dashed #B2CCFF;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:13px}
.install b{display:block;font-size:14px}
.install button{margin-left:auto;background:var(--navy);color:#fff;font-weight:700;padding:9px 12px;border-radius:11px;font-size:13px;flex:none}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,#eef1f6 25%,#f6f8fb 50%,#eef1f6 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r);aspect-ratio:.72}
@keyframes sk{to{background-position:-200% 0}}

/* ===== App shell (e-commerce) ===== */
.wrap{padding-bottom:calc(84px + var(--sb))}
.top{padding-bottom:16px}
.topacts{margin-left:auto;display:flex;gap:8px}
.hello{position:relative;z-index:1;margin:14px 0 12px}
.hello b{display:block;font-size:20px;font-weight:800;line-height:1.25}
.hello span{font-size:13px;opacity:.82}
.search.fake{cursor:text;color:#98A2B3;font-size:15px}
/* App bar for inner views */
.appbar{position:sticky;top:0;z-index:25;background:rgba(245,247,251,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(10px + var(--st)) 12px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.appbar h2{margin:0;font-size:17px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.appbar .search{flex:1;height:44px;box-shadow:none;border:1.5px solid var(--line)}
.appbar select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 8px;font-size:12.5px;font-weight:700;color:#344054}
/* Slider */
.slider{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:16px 16px 4px;scrollbar-width:none}
.slider::-webkit-scrollbar{display:none}
.slide{flex:0 0 calc(100% - 28px);scroll-snap-align:center;border-radius:22px;min-height:150px;padding:18px;color:#fff;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden;text-align:left}
.slide .tx{flex:1;position:relative;z-index:1}
.slide small{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;opacity:.85}
.slide b{display:block;font-size:20px;font-weight:800;line-height:1.2;margin:6px 0 10px}
.slide .cta{display:inline-block;background:#fff;color:var(--navy);font-weight:800;font-size:12.5px;padding:8px 12px;border-radius:10px}
.slide .im{width:42%;aspect-ratio:1;background:#fff;border-radius:18px;display:grid;place-items:center;padding:8px;flex:none;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.slide .im img{max-width:100%;max-height:100%;object-fit:contain}
.s1{background:linear-gradient(135deg,#0A2A66,#1557D6)}
.s2{background:linear-gradient(135deg,#0B7F5F,#16B88A)}
.s3{background:linear-gradient(135deg,#5B2BB5,#8E5CF0)}
.s4{background:linear-gradient(135deg,#B54708,#F79009)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.dots i{width:6px;height:6px;border-radius:9px;background:#D0D5DD;transition:.25s}
.dots i.on{width:18px;background:var(--navy)}
/* Category circles */
.hsec{margin-top:22px}
.hhead{display:flex;align-items:baseline;justify-content:space-between;padding:0 16px;margin-bottom:10px}
.hhead h3{margin:0;font-size:17px;font-weight:800}
.hhead button{font-size:13px;font-weight:700;color:var(--blue)}
.circles{display:flex;gap:14px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
.circles::-webkit-scrollbar{display:none}
.circ{flex:none;width:72px;text-align:center;font-size:11.5px;font-weight:700;color:#344054;line-height:1.25}
.circ .ci2{width:68px;height:68px;border-radius:22px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;padding:8px;margin:0 auto 6px;box-shadow:var(--shadow)}
.circ img{max-width:100%;max-height:100%;object-fit:contain}
/* Horizontal product strip */
.strip{display:flex;gap:12px;overflow-x:auto;padding:0 16px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .card{flex:0 0 152px;scroll-snap-align:start}
/* Packs */
.packs{display:flex;gap:12px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}
.packs::-webkit-scrollbar{display:none}
.pack{flex:0 0 270px;background:#fff;border-radius:20px;border:1px solid #EEF1F6;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column}
.pack .pi{display:flex;gap:6px;margin-bottom:10px}
.pack .pi span{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;padding:4px;background:#fff}
.pack .pi img{max-width:100%;max-height:100%;object-fit:contain}
.pack .pi em{font-style:normal;font-size:12px;font-weight:800;color:var(--muted);align-self:center}
.pack b{font-size:15.5px;font-weight:800}
.pack p{margin:4px 0 10px;font-size:12.5px;color:var(--muted);line-height:1.4;flex:1}
.pack .pf{display:flex;justify-content:space-between;align-items:center}
.pack .pf .price small{font-size:11px}
.pack .pf button{background:var(--blue);color:#fff;font-weight:700;font-size:13px;padding:10px 12px;border-radius:12px}
/* Trust row */
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px;margin-top:22px}
.trust div{background:#fff;border:1px solid #EEF1F6;border-radius:16px;padding:12px 8px;text-align:center;font-size:11.5px;font-weight:700;color:#344054;line-height:1.3}
.trust div i{display:block;font-style:normal;font-size:20px;margin-bottom:4px}
/* Category grid */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 16px}
.cbox{background:#fff;border-radius:20px;border:1px solid #EEF1F6;box-shadow:var(--shadow);padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:150px;position:relative;overflow:hidden}
.cbox .cimg{height:78px;display:flex;align-items:center;justify-content:center}
.cbox .cimg img{max-height:100%;max-width:100%;object-fit:contain}
.cbox b{font-size:14px;font-weight:800;line-height:1.25}
.cbox span{font-size:12px;color:var(--muted);font-weight:600}
/* Recent searches */
.recent{padding:14px 16px}
.recent h4{margin:0 0 10px;font-size:13px;color:var(--muted)}
.recent .chips{padding:0;flex-wrap:wrap}
/* Tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;z-index:45;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + var(--sb))}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:700;color:#98A2B3;position:relative}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--navy)}
.tabbar button.on svg{stroke:var(--navy)}
.tabbar .tb{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--mint);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;border:2px solid #fff}
.tabbar .tb[hidden]{display:none}
.pagehead{padding:16px 16px 4px}
.pagehead h1{margin:0;font-size:24px;font-weight:800}
.pagehead p{margin:4px 0 0;color:var(--muted);font-size:13px}

</style>
</head>
<body>
<div class="wrap" id="app"><main id="view"></main></div>

<nav class="tabbar" id="tabbar">
  <button data-go="" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="#98A2B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
  <button data-go="categories"><svg viewBox="0 0 24 24" fill="none" stroke="#98A2B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Catégories</button>
  <button data-cart><svg viewBox="0 0 24 24" fill="none" stroke="#98A2B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg><span class="tb" id="badge" hidden>0</span><span id="tabCart">Panier</span></button>
  <button data-go="commandes"><svg viewBox="0 0 24 24" fill="none" stroke="#98A2B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Commandes</button>
</nav>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="pSheet" role="dialog" aria-modal="true" aria-label="Produit">
  <div class="grab"></div>
  <div class="sh-h"><span></span><button class="x" data-close aria-label="Fermer">×</button></div>
  <div class="sh-b" id="pBody"></div>
  <div class="sh-f"><div class="row"><div class="qty"><button id="pMinus" aria-label="Moins">−</button><b id="pQty">1</b><button id="pPlus" aria-label="Plus">+</button></div><button class="primary" id="pAdd">Ajouter</button></div></div>
</section>

<section class="sheet" id="cSheet" role="dialog" aria-modal="true" aria-label="Panier">
  <div class="grab"></div>
  <div class="sh-h"><h3 id="cTitle">Mon panier</h3><button class="x" data-close aria-label="Fermer">×</button></div>
  <div class="sh-b" id="cBody"></div>
  <div class="sh-f" id="cFoot"></div>
</section>

<div class="toast" id="toast"></div>
<script src="app.js" defer></script>
</body>
</html>
